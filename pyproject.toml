[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow"
version = "0.1.0"
description = "Agent-powered, LLM-optimized documentation generation system with MCP serving"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "gitpython>=3.1.0",
    "unidiff>=0.7.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "mcp>=1.2.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
ui = [
    "textual>=0.80.0",
]

[project.scripts]
docflow = "docflow.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["docflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
